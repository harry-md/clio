<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin-layout :: layout(
          'Thống kê doanh thu', 'dashboard', ~{::content})}">
<body>
<section th:fragment="content">

  <div class="page-heading">
    <div>
      <h1 class="mb-1">Thống kê doanh thu</h1>
      <p class="text-muted mb-0"
         th:text="|Doanh thu nền tảng - ${stats.label}|">
      </p>
    </div>

    <form class="d-flex flex-wrap align-items-end gap-2"
          method="get"
          th:action="@{/}">
      <div>
        <label class="form-label" for="type">Thống kê theo</label>
        <select class="form-select" id="type" name="type">
          <option value="MONTH" th:selected="${stats.type == 'MONTH'}">
            Tháng
          </option>
          <option value="QUARTER" th:selected="${stats.type == 'QUARTER'}">
            Quý
          </option>
        </select>
      </div>

      <div>
        <label class="form-label" id="periodLabel" for="period" th:text="${stats.type == 'MONTH'} ? 'Tháng' : 'Quý'">
        </label>

        <select class="form-select" id="period" name="period" style="min-width: 120px" required>
          <option th:each="number : ${#numbers.sequence(1, (stats.type == 'MONTH' ? 12 : 4))}" th:value="${number}"
                  th:selected="${number == stats.period}"
                  th:text="${(stats.type == 'MONTH' ? 'Tháng ' : 'Quý ') + number}">
          </option>
        </select>
      </div>

      <div>
        <label class="form-label" for="year">Năm</label>
        <input class="form-control" style="width: 120px" id="year" name="year" type="number" min="2000" max="2100"
               required th:value="${stats.year}">
      </div>

      <button class="btn btn-primary" type="submit">
        Xem thống kê
      </button>
    </form>
  </div>

  <section class="row g-3 mb-4" aria-label="Tổng doanh thu kỳ được chọn">
    <div class="col-12 col-lg-4">
      <div class="panel h-100">
        <p class="text-muted mb-2">Tổng doanh thu nền tảng</p>
        <h2 class="h3 mb-0" th:text="|${#numbers.formatDecimal(stats.totalRevenue, 1, 'POINT', 2, 'COMMA')} đ|">
        </h2>
      </div>
    </div>

    <div class="col-12 col-lg-4">
      <div class="panel h-100">
        <p class="text-muted mb-2">Từ mua sách</p>
        <h2 class="h3 mb-0"
            th:text="|${#numbers.formatDecimal(
                stats.bookRevenue, 1, 'POINT', 2, 'COMMA')} đ|">
        </h2>
      </div>
    </div>

    <div class="col-12 col-lg-4">
      <div class="panel h-100">
        <p class="text-muted mb-2">Từ gói đọc</p>
        <h2 class="h3 mb-0"
            th:text="|${#numbers.formatDecimal(
                stats.subscriptionRevenue, 1, 'POINT', 2, 'COMMA')} đ|">
        </h2>
      </div>
    </div>
  </section>

  <div id="chartLoadError" class="alert alert-warning" role="alert" hidden>
    Không tải được thư viện biểu đồ. Vui lòng tải lại trang.
  </div>

  <div class="row g-3 mb-4">
    <div class="col-12 col-xl-4">
      <section class="panel h-100">
        <h2 class="h5 mb-1">Tỉ trọng doanh thu</h2>
        <div th:if="${stats.totalRevenue.signum() > 0}" style="position: relative; height: 350px; min-width: 0">
          <canvas id="sourceChart" role="img" aria-label="Tỷ trọng doanh thu mua sách và gói đọc">
          </canvas>
        </div>

        <p th:if="${stats.totalRevenue.signum() == 0}"
           class="text-center text-muted py-5 mb-0">
          Chưa có doanh thu trong kỳ này.
        </p>
      </section>
    </div>

    <div class="col-12 col-xl-8">
      <section class="panel h-100">
        <h2 class="h5 mb-1"
            th:text="${stats.type == 'MONTH'}
                ? 'Doanh thu trong tháng'
                : 'Doanh thu trong quý'">
        </h2>
        <p class="text-muted mb-3" th:text="${stats.label}"></p>

        <div style="position: relative; height: 350px; min-width: 0">
          <canvas id="detailChart" role="img" aria-label="Diễn biến doanh thu trong kỳ được chọn">
          </canvas>
        </div>
      </section>
    </div>
  </div>

  <section class="panel">
    <h2 th:text="|Top sách theo doanh thu nền tảng trong ${stats.label}.|" class="h5 mb-1"></h2>
    <div th:if="${!#lists.isEmpty(stats.topBooks)}"
         style="position: relative; height: 380px; min-width: 0">
      <canvas id="topChart" role="img"
              aria-label="Top sách theo doanh thu nền tảng trong kỳ được chọn">
      </canvas>
    </div>

    <p th:if="${#lists.isEmpty(stats.topBooks)}"
       class="text-center text-muted py-5 mb-0">
      Chưa có lượt mua sách trong kỳ này.
    </p>

  </section>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>

  <script th:inline="javascript">
      (() => {
          const stats = /*[[${stats}]]*/ null;

          if (!stats) {
              return;
          }

          const typeSelect = document.getElementById("type");
          const periodSelect = document.getElementById("period");
          const periodLabel = document.getElementById("periodLabel");

          let previousTime = typeSelect.value;

          typeSelect.addEventListener("change", () => {
              const nextTime = typeSelect.value;
              let selected = Number(periodSelect.value);

              if (previousTime === "MONTH" && nextTime === "QUARTER") {
                  selected = Math.ceil(selected / 3);
              } else if (previousTime === "QUARTER" && nextTime === "MONTH") {
                  selected = (selected - 1) * 3 + 1;
              }

              const monthly = nextTime === "MONTH";
              const count = monthly ? 12 : 4;
              const label = monthly ? "Tháng" : "Quý";

              periodLabel.textContent = label;
              periodSelect.replaceChildren();

              for (let number = 1; number <= count; number++) {
                  periodSelect.add(new Option(
                      `${label} ${number}`,
                      String(number),
                      false,
                      number === selected
                  ));
              }

              previousTime = nextTime;
          });

          if (typeof Chart === "undefined") {
              document.getElementById("chartLoadError").hidden = false;
              return;
          }

          const colors = {
              book: "#2563eb",
              subscription: "#f59e0b",
              grid: "#e5e7eb"
          };

          const moneyFormatter = new Intl.NumberFormat("en-US", {
              style: "currency",
              currency: "VND",
              minimumFractionDigits: 0,
              maximumFractionDigits: 2
          });

          const compactFormatter = new Intl.NumberFormat("en-US", {
              notation: "compact",
              maximumFractionDigits: 1
          });

          const countFormatter = new Intl.NumberFormat("en-US");

          const money = value => moneyFormatter.format(Number(value));
          const compactMoney = value =>
              compactFormatter.format(Number(value)) + " đ";

          const animation = window.matchMedia(
              "(prefers-reduced-motion: reduce)"
          ).matches ? false : {duration: 400};

          const legend = {
              position: "bottom",
              labels: {
                  usePointStyle: true,
                  padding: 20
              }
          };

          const sourceValues = [
              Number(stats.bookRevenue),
              Number(stats.subscriptionRevenue)
          ];

          const sourceTotal = sourceValues.reduce(
              (sum, value) => sum + value, 0
          );

          if (sourceTotal > 0) {
              new Chart(document.getElementById("sourceChart"), {
                  type: "pie",
                  data: {
                      labels: ["Mua sách", "Gói đọc"],
                      datasets: [{
                          data: sourceValues,
                          backgroundColor: [colors.book, colors.subscription],
                          borderColor: "#ffffff",
                          borderWidth: 3,
                          hoverOffset: 8
                      }]
                  },
                  options: {
                      responsive: true,
                      maintainAspectRatio: false,
                      animation,
                      plugins: {
                          legend,
                          tooltip: {
                              callbacks: {
                                  label(context) {
                                      const value = Number(context.raw);
                                      const percentage = value / sourceTotal * 100;

                                      return `${context.label}: ${money(value)} (${percentage.toFixed(1)}%)`;
                                  }
                              }
                          }
                      }
                  }
              });
          }

          new Chart(document.getElementById("detailChart"), {
              type: "bar",
              data: {
                  labels: stats.points.map(point => point.label),
                  datasets: [
                      {
                          label: "Mua sách",
                          data: stats.points.map(point => Number(point.bookRevenue)),
                          backgroundColor: colors.book,
                          maxBarThickness: 48
                      },
                      {
                          label: "Gói đọc",
                          data: stats.points.map(
                              point => Number(point.subscriptionRevenue)
                          ),
                          backgroundColor: colors.subscription,
                          maxBarThickness: 48
                      }
                  ]
              },
              options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  animation,
                  interaction: {
                      mode: "index",
                      intersect: false
                  },
                  scales: {
                      x: {
                          stacked: true,
                          grid: {display: false},
                      ticks: {
                          autoSkip: stats.type !== "MONTH",
                          minRotation: stats.type === "MONTH" ? 45 : 0,
                          maxRotation: stats.type === "MONTH" ? 45 : 0
                      }
                      },
                      y: {
                          stacked: true,
                          beginAtZero: true,
                          grid: {color: colors.grid},
                          ticks: {callback: compactMoney}
                      }
                  },
                  plugins: {
                      legend,
                      tooltip: {
                          callbacks: {
                              label(context) {
                                  return `${context.dataset.label}: ${money(context.parsed.y)}`;
                              },
                              footer(items) {
                                  const total = items.reduce(
                                      (sum, item) => sum + Number(item.parsed.y), 0
                                  );

                                  return "Tổng: " + money(total);
                              }
                          }
                      }
                  }
              }
          });

          const books = stats.topBooks;

          if (books.length > 0) {
              new Chart(document.getElementById("topChart"), {
                  type: "bar",
                  data: {
                      labels: books.map(book => {
                          const title = book.title.length > 38
                              ? book.title.slice(0, 38) + "..."
                              : book.title;

                          return `${title}`;
                      }),
                      datasets: [{
                          label: "Doanh thu nền tảng",
                          data: books.map(book => Number(book.revenue)),
                          backgroundColor: colors.book,
                          borderRadius: 5,
                          maxBarThickness: 38
                      }]
                  },
                  options: {
                      indexAxis: "y",
                      responsive: true,
                      maintainAspectRatio: false,
                      animation,
                      scales: {
                          x: {
                              beginAtZero: true,
                              grid: {color: colors.grid},
                              ticks: {callback: compactMoney}
                          },
                          y: {
                              grid: {display: false},
                              ticks: {autoSkip: false}
                          }
                      },
                      plugins: {
                          legend: {display: false},
                          tooltip: {
                              callbacks: {
                                  title(items) {
                                      if (!items.length) {
                                          return "";
                                      }

                                      const book = books[items[0].dataIndex];
                                      return `${book.title} (#${book.bookId})`;
                                  },
                                  label(context) {
                                      return "Doanh thu: " + money(context.parsed.x);
                                  },
                                  afterLabel(context) {
                                      return "Lượt mua: " + countFormatter.format(
                                          Number(books[context.dataIndex].sales)
                                      );
                                  }
                              }
                          }
                      }
                  }
              });
          }
      })();
  </script>
</section>
</body>
</html>
