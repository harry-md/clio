<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle}">Clio Admin</title>

  <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/assets/vendors/bootstrap-icons/bootstrap-icons.css}">
  <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>

<body>
<th:block th:fragment="sidebar(activePage)">
  <div class="sidebar-backdrop"
       data-sidebar-close>
  </div>
  <aside class="admin-sidebar" id="adminSidebar" aria-label="Main navigation">
    <div class="sidebar-header">
      <a class="brand-mark" th:href="@{/}" aria-label="Clio dashboard">
        <span class="brand-icon">
              <i class="bi bi-grid-1x2-fill"></i>
        </span>
        <span class="brand-copy">
          <span class="brand-title">Clio</span>
          <span class="brand-subtitle">Admin Dashboard</span>
        </span>
      </a>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-link"
         th:classappend="${activePage == 'dashboard'} ? 'active' : ''"
         th:href="@{/}"><span class="nav-icon"><i class="bi bi-speedometer2"></i></span>
        <span class="nav-text">Dashboard</span>
      </a>

      <a class="nav-link" th:classappend="${activePage == 'users'} ? 'active' : ''" th:href="@{/users}">
        <span class="nav-icon">
            <i class="bi bi-people"></i>
        </span>
        <span class="nav-text">Users</span>
      </a>

      <a class="nav-link" th:classappend="${activePage == 'publishers'} ? 'active' : ''" th:href="@{/publishers}">
        <span class="nav-icon">
            <i class="bi bi-person-badge"></i>
        </span>
        <span class="nav-text">Publishers</span>
      </a>

      <a class="nav-link" th:href="@{/charts}">
        <span class="nav-icon"><i class="bi bi-bar-chart-line"></i></span>
        <span class="nav-text">Charts</span>
      </a>

      <a class="nav-link" th:href="@{/tables}">
        <span class="nav-icon"><i class="bi bi-table"></i></span>
        <span class="nav-text">Tables</span>
      </a>
    </nav>
  </aside>

</th:block>


<nav class="navbar admin-navbar navbar-expand bg-white" th:fragment="topnav">
  <div class="container-fluid px-3 px-lg-4">
    <button class="sidebar-toggle"
            type="button"
            data-sidebar-toggle
            aria-controls="adminSidebar"
            aria-expanded="true"
            aria-label="Toggle sidebar">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="navbar-actions ms-auto">

      <button class="icon-button theme-toggle"
              type="button"
              data-theme-toggle
              aria-label="Switch color theme">

        <i class="bi bi-moon-stars"
           data-theme-icon>
        </i>
      </button>
      <div class="dropdown">
        <button class="profile-button dropdown-toggle"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false">

          <img class="avatar-img avatar-md sidebar-user-avatar" style="width: 40px; height: 40px;"
               th:src="${currentAdmin.avatar}"
               th:alt="|${currentAdmin.firstName} ${currentAdmin.lastName}|">
          <strong th:text="|${currentAdmin.firstName} ${currentAdmin.lastName}|">Admin</strong>
          <small th:text="${currentAdmin.role}">ADMIN</small>
        </button>

        <ul class="dropdown-menu dropdown-menu-end">
          <li>
            <hr class="dropdown-divider">
          </li>

          <li>
            <form th:action="@{/logout}"
                  method="post">

              <input type="hidden"
                     th:name="${_csrf.parameterName}"
                     th:value="${_csrf.token}">

              <button class="dropdown-item"
                      type="submit">
                Log out
              </button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<footer class="admin-footer" th:fragment="footer">
  <div class="container-fluid px-3 px-lg-4">
    <span>&copy; 2026 Clio</span>
  </div>
</footer>

</body>
</html>
