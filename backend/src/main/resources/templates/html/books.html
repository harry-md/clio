<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{html/base :: head('Books')}"></head>

<body>
<div class="admin-shell">
  <div th:replace="~{html/base :: sidebar('books')}"></div>

  <div class="admin-main">
    <div th:replace="~{html/base :: topnav}"></div>

    <main class="dashboard-content">
      <div class="container-fluid px-3 px-lg-4 py-4">

        <div class="page-heading">
          <div class="page-heading-copy">
            <span class="page-icon">
              <i class="bi bi-book"></i>
            </span>

            <div>
              <h1 class="h3 mb-1">Quản lý sách</h1>
            </div>
          </div>
        </div>

        <section class="panel mt-3">
          <div class="panel-header">
            <div>
              <h2 class="h5 mb-1 section-title">
                <i class="bi bi-funnel"></i>
                <span>Bộ lọc</span>
              </h2>
            </div>
          </div>

          <form method="get" th:action="@{/books}" th:object="${filter}" class="p-3">
            <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
              <ul class="mb-0">
                <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
              </ul>
            </div>

            <div class="row g-3">
              <div class="col-12 col-md-4">
                <label class="form-label" for="title">Tên sách</label>
                <input id="title" class="form-control" type="search" th:field="*{title}" placeholder="Nhập tên sách">
              </div>

              <div class="col-12 col-md-4">
                <label class="form-label" for="authorFullname">Tác giả</label>
                <input id="authorFullname" class="form-control" type="search" th:field="*{authorFullname}"
                       placeholder="Nhập tên tác giả">
              </div>

              <div class="col-12 col-md-4">
                <label class="form-label" for="categoryId">Danh mục</label>
                <select id="categoryId" class="form-select" th:field="*{categoryId}">
                  <option value="">Tất cả danh mục</option>
                  <option th:each="category : ${categories}" th:value="${category.id}"
                          th:text="${category.name}"></option>
                </select>
              </div>

              <div class="col-12 col-md-3">
                <label class="form-label" for="fromPrice">Giá từ</label>
                <input id="fromPrice" class="form-control" type="number" min="0" step="10000" th:field="*{fromPrice}">
              </div>

              <div class="col-12 col-md-3">
                <label class="form-label" for="toPrice">Giá đến</label>
                <input id="toPrice" class="form-control" type="number" min="0" step="0.01" th:field="*{toPrice}">
              </div>

              <div class="col-12 col-md-3">
                <label class="form-label" for="fromRating">Rating từ</label>
                <input id="fromRating" class="form-control" type="number" min="0" max="5" th:field="*{fromRating}">
              </div>

              <div class="col-12 col-md-3">
                <label class="form-label" for="toRating">Rating đến</label>
                <input id="toRating" class="form-control" type="number" min="0" max="5" th:field="*{toRating}">
              </div>

            </div>

            <div class="d-flex gap-2 mt-3">
              <button class="btn btn-primary" type="submit">
                <i class="bi bi-search"></i>
                Tìm kiếm
              </button>

              <a class="btn btn-outline-secondary" th:href="@{/books}">
                Xóa bộ lọc
              </a>
            </div>
          </form>
        </section>

        <section class="panel mt-3">
          <div class="panel-header">
            <div>
              <h2 class="h5 mb-1 section-title">
                <i class="bi bi-table"></i>
                <span>Danh sách sách</span>
              </h2>

              <p class="text-muted mb-0" th:text="|Tìm thấy ${books.totalElements} cuốn sách|">
              </p>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
              <tr>
                <th>ID</th>
                <th>Bìa</th>
                <th>Tiêu đề</th>
                <th>Tác giả</th>
                <th>Giá</th>
                <th>Đánh giá</th>
                <th>Trạng thái</th>
                <th>Đang hoạt động</th>
              </tr>
              </thead>

              <tbody>
              <tr th:each="book : ${books.content}">
                <td th:text="${book.id}"></td>

                <td>
                  <img class="admin-book-thumbnail" th:src="${book.thumbnail}" th:alt="${book.title}">
                </td>

                <td>
                  <p class="fw-semibold mb-0" th:text="${book.title}"></p>
                </td>

                <td>
                  <span th:if="${book.authors == null or #lists.isEmpty(book.authors)}" class="text-muted"></span>
                  <span th:each="author, stat : ${book.authors}"
                        th:text="${author.authorFullname} + (${stat.last} ? '' : ', ')"></span>
                </td>

                <td th:text="${book.price}"></td>

                <td>
                  <span th:if="${book.rating != null}" th:text="|${book.rating} (${book.ratingCount})|"></span>
                  <span th:if="${book.rating == null}" class="text-muted">Chưa có</span>
                </td>

                <td>
                  <span class="badge" th:classappend="${book.status.name() == 'COMPLETED'}
                          ? ' text-bg-success'
                          : (${book.status.name() == 'QUEUED'}
                            ? ' text-bg-warning'
                            : ' text-bg-danger')"
                        th:text="${book.status}">
                  </span>
                </td>

                <td>
                  <div class="d-flex flex-column align-items-start gap-2">

                  <span class="badge" th:classappend="${book.active} ? ' text-bg-success' : ' text-bg-secondary'"
                        th:text="${book.active} ? 'Active' : 'Inactive'">
                  </span>

                    <form method="post" th:action="@{/books/{bookId}/active(bookId=${book.id})}">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                      <input type="hidden" name="active" th:value="${!book.active}">

                      <button class="btn btn-sm"
                              th:classappend="${book.active} ? ' btn-outline-danger' : ' btn-outline-success'"
                              th:text="${book.active} ? 'Disable' : 'Enable'" type="submit">
                      </button>
                    </form>
                  </div>
                </td>
              </tr>

              <tr th:if="${books.empty}">
                <td colspan="8" class="text-center text-muted py-4">
                  Không tìm thấy sách.
                </td>
              </tr>
              </tbody>
            </table>
          </div>

          <div class="d-flex justify-content-between align-items-center p-3" th:if="${books.totalPages > 0}">

            <span class="text-muted" th:text="|Trang ${books.number + 1}/${books.totalPages}|"></span>

            <nav th:if="${books.totalPages > 1}"
                 aria-label="Book pagination">

              <ul class="pagination mb-0">

                <li class="page-item"
                    th:classappend="${books.first} ? 'disabled'">

                  <a class="page-link" th:href="@{/books(
                         page=${books.number - 1},
                         size=${books.size},
                         title=${filter.title},
                         authorFullname=${filter.authorFullname},
                         categoryId=${filter.categoryId},
                         fromPrice=${filter.fromPrice},
                         toPrice=${filter.toPrice},
                         fromRating=${filter.fromRating},
                         toRating=${filter.toRating}
                 )}">
                    Trước
                  </a>
                </li>

                <li class="page-item" th:each="pageNumber : ${pageNumbers}"
                    th:classappend="${pageNumber == books.number} ? 'active'">

                  <a class="page-link" th:href="@{/books(
                         page=${pageNumber},
                         size=${books.size},
                         title=${filter.title},
                         authorFullname=${filter.authorFullname},
                         categoryId=${filter.categoryId},
                         fromPrice=${filter.fromPrice},
                         toPrice=${filter.toPrice},
                         fromRating=${filter.fromRating},
                         toRating=${filter.toRating}
                 )}" th:text="${pageNumber + 1}">
                  </a>
                </li>

                <li class="page-item" th:classappend="${books.last} ? 'disabled'">

                  <a class="page-link" th:href="@{/books(
                         page=${books.number + 1},
                         size=${books.size},
                         title=${filter.title},
                         authorFullname=${filter.authorFullname},
                         categoryId=${filter.categoryId},
                         fromPrice=${filter.fromPrice},
                         toPrice=${filter.toPrice},
                         fromRating=${filter.fromRating},
                         toRating=${filter.toRating}
                 )}">
                    Sau
                  </a>
                </li>

              </ul>
            </nav>
          </div>
        </section>

      </div>
    </main>

    <footer th:replace="~{html/base :: footer}"></footer>
  </div>
</div>

<script th:src="@{/assets/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/js/main.js}"></script>
</body>
</html>
