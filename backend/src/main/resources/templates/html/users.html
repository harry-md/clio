<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{html/base :: head('Users')}"></head>

<body>
<div class="admin-shell">
  <div th:replace="~{html/base :: sidebar('users')}"></div>

  <div class="admin-main">
    <div th:replace="~{html/base :: topnav}"></div>

    <main class="dashboard-content">
      <div class="container-fluid px-3 px-lg-4 py-4">

        <div class="page-heading">
          <div class="page-heading-copy">
            <span class="page-icon">
              <i class="bi bi-people"></i>
            </span>

            <div>
              <h1 class="h3 mb-1">Quản lý tài khoản</h1>
            </div>
          </div>
        </div>

        <section class="panel mt-3">
          <form method="get" th:action="@{/users}" th:object="${filter}" class="p-3">
            <div class="row g-3">
              <div class="col-12 col-md-3">
                <label class="form-label" for="username">Username</label>
                <input id="username" class="form-control" type="search" th:field="*{username}">
              </div>

              <div class="col-12 col-md-3">
                <label class="form-label" for="firstName">Tên</label>
                <input id="firstName" class="form-control" type="search" th:field="*{firstName}">
              </div>

              <div class="col-12 col-md-3">
                <label class="form-label" for="lastName">Họ</label>
                <input id="lastName" class="form-control" type="search" th:field="*{lastName}">
              </div>

              <div class="col-12 col-md-3">
                <label class="form-label" for="email">Email</label>
                <input id="email" class="form-control" type="search" th:field="*{email}">
              </div>
            </div>

            <div class="d-flex gap-2 mt-3">
              <button class="btn btn-primary" type="submit">
                <i class="bi bi-search"></i>
                Tìm kiếm
              </button>

              <a class="btn btn-outline-secondary" th:href="@{/users}">
                Xóa bộ lọc
              </a>
            </div>
          </form>
        </section>

        <section class="panel mt-3">
          <div class="panel-header">
            <div>
              <h2 class="h5 mb-1 section-title">
                <i class="bi bi-table"></i>
                <span>Danh sách user</span>
              </h2>

              <p class="text-muted mb-0"
                 th:text="|Tìm thấy ${users.totalElements} user|">
              </p>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
              <tr>
                <th>User</th>
                <th>Email</th>
                <th>Role</th>
                <th>Ngày tạo</th>
              </tr>
              </thead>

              <tbody>
              <tr th:each="user : ${users.content}">
                <td>
                  <div class="d-flex align-items-center gap-3">
                    <img class="avatar-img avatar-sm" th:src="${user.avatar}" th:alt="|${user.firstName} ${user.lastName}|">
                    <div>
                      <p class="fw-semibold mb-0" th:text="|${user.firstName} ${user.lastName}|"></p>
                      <small class="text-muted" th:text="${user.username}"></small>
                    </div>
                  </div>
                </td>

                <td th:text="${user.email}"></td>

                <td>
                  <span class="badge" th:classappend="${user.role.name() == 'ADMIN'}
                          ? ' text-bg-danger'
                          : (${user.role.name() == 'PUBLISHER'}
                            ? ' text-bg-warning'
                            : ' text-bg-primary')"
                        th:text="${user.role}">
                  </span>
                </td>

                <td th:text="${#temporals.format(
                    user.createdAt,
                    'dd/MM/yyyy HH:mm'
                )}">
                </td>
              </tr>

              <tr th:if="${users.empty}">
                <td colspan="4" class="text-center text-muted py-4">
                  Không tìm thấy user.
                </td>
              </tr>
              </tbody>
            </table>
          </div>

          <div class="d-flex justify-content-between align-items-center p-3" th:if="${users.totalPages > 0}">

            <span class="text-muted" th:text="|Trang ${users.number + 1}/${users.totalPages}|"></span>
            <nav th:if="${users.totalPages > 1}"
                 aria-label="User pagination">

              <ul class="pagination mb-0">

                <li class="page-item"
                    th:classappend="${users.first} ? 'disabled'">
                  <a class="page-link"
                     th:href="@{/users(
           page=${users.number - 1},
           size=${users.size},
           username=${filter.username},
           firstName=${filter.firstName},
           lastName=${filter.lastName},
           email=${filter.email}
         )}">
                    Trước
                  </a>
                </li>

                <li class="page-item"
                    th:each="pageNumber : ${pageNumbers}"
                    th:classappend="${pageNumber == users.number} ? 'active'">

                  <a class="page-link"
                     th:href="@{/users(
           page=${pageNumber},
           size=${users.size},
           username=${filter.username},
           firstName=${filter.firstName},
           lastName=${filter.lastName},
           email=${filter.email}
         )}"
                     th:text="${pageNumber + 1}">
                  </a>
                </li>

                <li class="page-item"
                    th:classappend="${users.last} ? 'disabled'">
                  <a class="page-link"
                     th:href="@{/users(
           page=${users.number + 1},
           size=${users.size},
           username=${filter.username},
           firstName=${filter.firstName},
           lastName=${filter.lastName},
           email=${filter.email}
         )}">
                    Sau
                  </a>
                </li>

              </ul>
            </nav>
          </div>
        </section>
      </div>
    </main>

    <footer th:replace="~{html/base :: footer}"></footer>
  </div>
</div>

<script th:src="@{/assets/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/js/main.js}"></script>
</body>
</html>
