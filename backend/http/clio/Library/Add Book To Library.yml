info:
  name: Add Book To Library
  type: http
  seq: 1

http:
  method: POST
  url: "{{LOCAL_API_URL}}/libraries"
  body:
    type: json
    data: |-
      {
        "bookId": 17
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
