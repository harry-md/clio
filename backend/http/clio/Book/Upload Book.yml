info:
  name: Upload Book
  type: http
  seq: 1

http:
  method: POST
  url: "{{LOCAL_API_URL}}/books"
  body:
    type: json
    data: |-
      {
        "title": "The Stranger",
        "price": 60000,
        "authors": [
          {
            "authorId": 16,
            "role": "AUTHOR"
          }
        ],
        "categoryIds": [21],
        "language": "EN",
        "objectKey": "books/origin/b783da7e-ed45-4bcb-981a-151248b336d6.epub"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
