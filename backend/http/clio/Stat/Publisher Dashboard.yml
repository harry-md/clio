info:
  name: Publisher Dashboard
  type: http
  seq: 1

http:
  method: GET
  url: "{{LOCAL_API_URL}}/publishers/current-publisher/dashboard?year=2026&month=8"
  params:
    - name: year
      value: "2026"
      type: query
    - name: month
      value: "8"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
